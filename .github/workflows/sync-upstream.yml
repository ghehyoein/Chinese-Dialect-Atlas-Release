name: Sync upstream dev source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Upstream ref to copy (normally dev)"
        type: string
        default: "dev"
        required: true

permissions:
  contents: write

concurrency:
  group: sync-upstream-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout upstream source, including history
        uses: actions/checkout@v4
        with:
          repository: jengzang/dialects-vue-frontend
          ref: ${{ inputs.source_ref || 'dev' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Copy exact upstream commit to upstream-dev branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          gh auth setup-git
          git remote add publisher "https://github.com/$GITHUB_REPOSITORY.git"
          git push publisher HEAD:refs/heads/upstream-dev
          echo "Copied upstream commit $source_sha to branch upstream-dev" >> "$GITHUB_STEP_SUMMARY"

name: Manual TestFlight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional dev commit SHA; blank syncs latest dev"
        required: false
        default: ""
        type: string
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: chinese-dialect-atlas-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.import.outputs.source_sha }}
    steps:
      - name: Checkout upstream dev
        uses: actions/checkout@v4
        with:
          repository: jengzang/dialects-vue-frontend
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Import approved dev revision into upstream-dev
        id: import
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED_SHA" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::source_sha must be a full 40-character commit SHA"; exit 1; }
            requested="$(echo "$REQUESTED_SHA" | tr A-F a-f)"
            git cat-file -e "$requested^{commit}"
            git merge-base --is-ancestor "$requested" origin/dev || { echo "::error::Selected SHA is not in upstream dev history"; exit 1; }
            git checkout --detach "$requested"
            sha="$(git rev-parse HEAD)"
          fi
          gh auth setup-git
          git remote add publisher "https://github.com/$GITHUB_REPOSITORY.git"
          git push --force publisher HEAD:refs/heads/upstream-dev
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Imported dev commit: $sha" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
      APP_VERSION: ${{ inputs.app_version }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No valid synchronized source commit"; exit 1; }
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::app_version must be in the form 1.0.0"; exit 1; }
          if [[ ! "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::Set APP_BUNDLE_ID under Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          if [[ ! "$APP_GROUP_ID" =~ ^group\.[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Set APP_GROUP_ID under Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ghehyoein/Chinese-Dialect-Atlas-Release
          ref: ${{ needs.sync.outputs.source_sha }}
          persist-credentials: false

      - name: Verify imported source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Building imported dev commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Build public upstream without Apple credentials
        working-directory: project
        run: |
          npm ci
          npm run build:ios
          npx cap sync ios

      - name: Configure iOS app and AudioShare extension
        shell: bash
        run: |
          set -euo pipefail
          : "${APP_GROUP_ID:?Set APP_GROUP_ID in Actions variables}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          bundle, group = os.environ["APP_BUNDLE_ID"], os.environ["APP_GROUP_ID"]
          if not group.startswith("group."):
              raise SystemExit("Invalid APP_GROUP_ID")
          config = Path("project/capacitor.config.json")
          data = json.loads(config.read_text())
          data["appId"] = bundle
          config.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          path = Path("ios/App/App.xcodeproj/project.pbxproj")
          contents = path.read_text()
          replacements = [
              ("PRODUCT_BUNDLE_IDENTIFIER = top.yzup.dialects.AudioShare;", f"PRODUCT_BUNDLE_IDENTIFIER = {bundle}.AudioShare;", 2),
              ("PRODUCT_BUNDLE_IDENTIFIER = top.yzup.dialects;", f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};", 2),
              ("MARKETING_VERSION = 1.0;", f"MARKETING_VERSION = {os.environ['APP_VERSION']};", 4),
              ("CURRENT_PROJECT_VERSION = 1;", f"CURRENT_PROJECT_VERSION = {os.environ['BUILD_NUMBER']};", 4),
          ]
          for old, new, expected in replacements:
              count = contents.count(old)
              if count != expected:
                  raise SystemExit(f"Unexpected dev Xcode project layout: {old} (found {count})")
              contents = contents.replace(old, new)
          path.write_text(contents)
          for name in ("ios/App/App/App.entitlements", "ios/App/AudioShare/AudioShare.entitlements", "ios/App/Shared/SharedAudioInbox.swift"):
              p = Path(name)
              t = p.read_text()
              if "group.top.yzup.dialects" not in t:
                  raise SystemExit(f"Missing known App Group reference: {name}")
              p.write_text(t.replace("group.top.yzup.dialects", group))
          PY

      - name: Archive unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dialects.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p out/Payload
          ditto "$RUNNER_TEMP/Dialects.xcarchive/Products/Applications/App.app" out/Payload/App.app
          (cd out && ditto -c -k --norsrc --keepParent Payload unsigned.ipa)
          rm -rf out/Payload

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: out/unsigned.ipa
          retention-days: 1
          if-no-files-found: error

  sign-and-upload:
    needs: build
    runs-on: macos-15
    timeout-minutes: 35
    environment: appstore
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID }}
      P12: ${{ secrets.SIGNING_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      PROFILE: ${{ secrets.APP_PROFILE_BASE64 }}
      EXT_PROFILE: ${{ secrets.EXT_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ipa
          path: received

      - name: Verify, sign and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${APP_BUNDLE_ID:?Missing APP_BUNDLE_ID}"
          : "${P12:?Missing P12}"
          : "${P12_PASSWORD:?Missing P12 password}"
          : "${PROFILE:?Missing provisioning profile}"
          : "${EXT_PROFILE:?Missing AudioShare provisioning profile}"
          : "${APP_GROUP_ID:?Missing APP_GROUP_ID}"
          : "${ASC_PRIVATE_KEY:?Missing API private key}"
          : "${ASC_KEY_ID:?Missing API key ID}"
          : "${ASC_ISSUER_ID:?Missing API issuer ID}"
          secure="$RUNNER_TEMP/signing"
          mkdir -p "$secure"
          keychain="$secure/temporary.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$secure"' EXIT

          python3 - <<'PY'
          import stat, zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile("received/unsigned.ipa") as z:
              for i in z.infolist():
                  p = PurePosixPath(i.filename)
                  if p.is_absolute() or ".." in p.parts or not p.parts or p.parts[0] != "Payload":
                      raise SystemExit("Unsafe archive path")
                  if stat.S_IFMT(i.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit("Unexpected symlink in IPA")
          PY
          ditto -x -k received/unsigned.ipa "$secure"
          app="$secure/Payload/App.app"
          test -f "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$APP_BUNDLE_ID"
          extension="$app/PlugIns/AudioShare.appex"
          test -f "$extension/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extension/Info.plist")" = "$APP_BUNDLE_ID.AudioShare"
          count="$(find "$app/PlugIns" -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')"
          test "$count" = 1 || { echo "Unexpected app extensions"; exit 1; }

          printf '%s' "$PROFILE" | base64 -D > "$secure/app.mobileprovision"
          printf '%s' "$EXT_PROFILE" | base64 -D > "$secure/ext.mobileprovision"
          security cms -D -i "$secure/app.mobileprovision" > "$secure/profile.plist"
          security cms -D -i "$secure/ext.mobileprovision" > "$secure/ext-profile.plist"
          python3 - <<'PY'
          import datetime, os, plistlib
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "signing"
          team = os.environ["APPLE_TEAM_ID"]
          bundle = os.environ["APP_BUNDLE_ID"]
          group = os.environ["APP_GROUP_ID"]
          for profile, suffix in (("profile",""), ("ext-profile",".AudioShare")):
              p = plistlib.loads((root / f"{profile}.plist").read_bytes())
              ent = p["Entitlements"]
              if team not in p["TeamIdentifier"] or ent.get("application-identifier") != f"{team}.{bundle}{suffix}":
                  raise SystemExit(f"Wrong team or Bundle ID in {profile}")
              if group not in ent.get("com.apple.security.application-groups",[]):
                  raise SystemExit(f"Wrong App Group in {profile}")
              if ent.get("get-task-allow",False) or "ProvisionedDevices" in p or p.get("ProvisionsAllDevices"):
                  raise SystemExit(f"Not App Store distribution: {profile}")
              if p["ExpirationDate"].replace(tzinfo=datetime.timezone.utc) <= datetime.datetime.now(datetime.timezone.utc):
                  raise SystemExit(f"Expired: {profile}")
              (root / f"{profile}-entitlements.plist").write_bytes(plistlib.dumps(ent))
          PY
          cp "$secure/app.mobileprovision" "$app/embedded.mobileprovision"
          cp "$secure/ext.mobileprovision" "$extension/embedded.mobileprovision"

          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          printf '%s' "$P12" | base64 -D > "$secure/identity.p12"
          security import "$secure/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$secure/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Apple Distribution/ { print $2; exit }')"
          test -n "$identity" || { echo "Apple Distribution identity missing"; exit 1; }

          sign_frameworks() {
            local target="$1"
            if [ -d "$target/Frameworks" ]; then
              find "$target/Frameworks" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' lib; do
                codesign --force --sign "$identity" --timestamp=none "$lib"
              done
              find "$target/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' lib; do
                codesign --force --sign "$identity" --timestamp=none "$lib"
              done
            fi
          }
          sign_frameworks "$extension"
          codesign --force --sign "$identity" --timestamp=none \
            --entitlements "$secure/ext-profile-entitlements.plist" "$extension"
          sign_frameworks "$app"
          codesign --force --sign "$identity" --timestamp=none \
            --entitlements "$secure/profile-entitlements.plist" "$app"
          codesign --verify --strict "$extension"
          codesign --verify --deep --strict --verbose=2 "$app"
          (cd "$secure" && ditto -c -k --norsrc --keepParent Payload signed.ipa)

          mkdir -p "$secure/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$secure/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$secure/private_keys/AuthKey_$ASC_KEY_ID.p8"
          API_PRIVATE_KEYS_DIR="$secure/private_keys" \
            xcrun altool --upload-app --type ios --file "$secure/signed.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
